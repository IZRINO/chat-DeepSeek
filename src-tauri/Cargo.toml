[package]
name = "chat-deepseek"
version = "0.1.2"
description = "真DEEPSEEK chat client"
license = "MIT"
repository = "https://github.com/IZRINO/chat-DeepSeek"
edition = "2024"
rust-version = "1.90"

[lib]
name = "chat_deepseek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
url = { version = "2", features = ["serde"] }
percent-encoding = "2"
tokio = { version = "1", features = ["sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "system-proxy"] }

[dev-dependencies]
tokio = { version = "1", features = ["time"] }
